[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pelican-myst-reader"
version = "1.4.0"
description = "Pelican plugin for converting MyST's Markdown variant to HTML."
authors = [{ name = "Ashwin Vishnu", email = "dev@fluid.quest" }]
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "pelican>=4.11",
    "markdown-word-count>=0.1.0",
    "beautifulsoup4>=4.13",
    "myst-parser>=5.1",
    "docutils>=0.20",
    "pybtex>=0.25.1",
    "sphinxcontrib-bibtex>=2.7",
    # for pybtex
    "setuptools>=68",
    "pyyaml>=6",
    "markdown-it-py[linkify,plugins]>=4.2",
]
readme = "README.md"
keywords = ["pelican", "plugin", "markdown", "myst"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Pelican",
    "Framework :: Pelican :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Sponsor = "https://fluid.quest/pages/sponsors.html"
Funding = "https://donate.getpelican.com/"
"Issue Tracker" = "https://github.com/ashwinvis/myst-reader/issues"
Repository = "https://github.com/ashwinvis/myst-reader"
Documentation = "https://docs.getpelican.com"

[project.optional-dependencies]
markdown = ["markdown>=3.2.2"]

[dependency-groups]
tests = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-pythonpath>=0.7.3",
    "pytest-sugar>=1.0.0",
    "pytest-subtests>=0.13.1",
]
dev = [
    "black>=24.4.2",
    "invoke>=2.2",
    "livereload>=2.6",
    "markdown>=3.2.2",
    "Werkzeug>=3.0",
    "pre-commit>=3.7.1",
    "nox>=2024.4.15",
]

[tool.hatch.build.targets.wheel]
packages = ["pelican"]

[tool.coverage.run]
omit = ["*/conf.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLE"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["pelican"]
known-third-party = ["myst_reader"]
